[platformio]
default_envs = esp

[env]
framework = arduino
monitor_speed = 115200

build_flags =
    -std=gnu++17
    -Iinclude
    -Iexternal

lib_ldf_mode = deep+

[env:esp]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 160000000L

lib_deps =
    earlephilhower/ESP8266Audio

build_flags =
    ${env.build_flags}
    -DPLATFORM_ESP

build_src_filter =
    +<main.cpp>
    -<tests/>


[env:teensy40]
platform = teensy
board = teensy40

build_flags =
    ${env.build_flags}
    -DPLATFORM_TEENSY
    -DBLASTER_TEENSY_LED_PIN=2
    -DBLASTER_TEENSY_LED_COUNT=1

build_src_filter =
    +<main.cpp>
    -<tests/>


[env:stm32f411_blackpill]
platform = ststm32
board = blackpill_f411ce
board_build.f_cpu = 100000000L

lib_deps =
    arduino-libraries/SD

build_flags =
    ${env.build_flags}
    -DPLATFORM_STM32F411
    -DBLASTER_STM32F411_BOARD_BLACKPILL
    -DBLASTER_STM32F411_LED_COUNT=1

build_src_filter =
    +<main.cpp>
    -<tests/>


